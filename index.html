<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garagem | Catálogo de carros</title>
  <meta name="description" content="Catálogo de carros com modelo 3D, ficha técnica e curiosidades.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="wrap"><a class="logo" href="index.html">Garagem</a></div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>Catálogo</h1>
      <p id="contagem">Carregando carros…</p>
    </section>

    <div class="filtros">
      <input id="busca" type="search" placeholder="Buscar por marca ou modelo" aria-label="Buscar por marca ou modelo">
      <select id="filtroMarca" aria-label="Filtrar por marca"><option value="">Todas as marcas</option></select>
    </div>

    <div id="grade" class="grade"></div>
    <p id="msg" class="msg" role="status"></p>
  </main>

  <footer class="rodape"><div class="wrap">Projeto da disciplina Linguagem de Programação para Web.</div></footer>
  <script type="module" src="js/catalogo.js"></script>
</body>
</html>
